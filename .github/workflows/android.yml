name: Android CI

on:
  push:
    branches: [ "Develop" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - '.gitignore'
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [ "Develop" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - '.gitignore'
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:

      - name: Generate bot data
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          echo "RANDOM_QUOTE=$(shuf -n1 <<<"$LIST_OF_QUOTES")" >> $GITHUB_ENV
        env:
          LIST_OF_QUOTES: ${{ secrets.LIST_OF_QUOTES }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set release type
        run: echo releaseType=CI > package.properties

      # 1. Проверяем, что секреты вообще пришли (с вашими ИМЕНАМИ секретов)
      - name: Check signing secrets present
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          check() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Secret $name is EMPTY or missing"
              exit 1
            else
              echo "Secret $name: present (${#value} chars)"
            fi
          }
          check "SIGNING_KEY" "${{ secrets.SIGNING_KEY }}"
          check "KEY_STORE_PASSWORD" "${{ secrets.KEY_STORE_PASSWORD }}"
          check "ALIAS" "${{ secrets.ALIAS }}"
          check "KEY_PASSWORD" "${{ secrets.KEY_PASSWORD }}"

      # 2. Создаём keystore в домашней папке пользователя
      - name: Create signing files
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          set -euo pipefail
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > $HOME/key.jks
          echo "--- diagnostics ---"
          ls -l $HOME/key.jks
          head -c 8 $HOME/key.jks | xxd   # Проверка magic-байт JKS (должно быть cafebabe)
          echo "-------------------"

      # 3. ПАТЧ: отключаем сломанный плагин pt.jcosta.resourceplaceholders,
      #    который не совместим с Gradle 9.4.1 (падает на задаче
      #    :app:resourcePlaceholdersForRelease с ошибкой про mapped value).
      - name: Patch build.gradle to skip broken resourcePlaceholders
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          cat >> app/build.gradle.kts << 'EOF'

          // WORKAROUND: pt.jcosta.resourceplaceholders is broken with Gradle 9
          tasks.configureEach {
              if (name.startsWith("resourcePlaceholdersFor")) {
                  enabled = false
              }
          }
          EOF
          echo "Patched app/build.gradle.kts. Tail:"
          tail -n 8 app/build.gradle.kts

      # 4. Сборка: передаем переменные ТОЛЬКО через env, так как build.gradle читает System.getenv()
      - name: Build with Gradle
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        env:
          # ВАЖНО: build.gradle ждет именно эти имена (префикс AKANE_RELEASE)
          AKANE_RELEASE_STORE_FILE: /home/runner/key.jks
          AKANE_RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          AKANE_RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          AKANE_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-configuration-cache --stacktrace

      - name: Build debug APK for arm64-v8a
        if: github.ref == 'refs/heads/debug' && github.event_name != 'pull_request'
        run: ./gradlew :app:assembleDebug -PtargetAbi=arm64-v8a

      - name: Build debug APK (no release keystore required)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug

      # 5. При падении печатаем состояние (упрощено, так как мы не пишем в ~/.gradle/gradle.properties)
      - name: Dump signing state on failure
        if: failure() && github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          echo "--- keystore file ---"
          ls -l "$HOME/key.jks" 2>/dev/null || echo "~/key.jks missing"
          echo "--- check env vars (masked) ---"
          echo "AKANE_RELEASE_STORE_FILE is set: ${{ env.AKANE_RELEASE_STORE_FILE != '' }}"
          echo "AKANE_RELEASE_KEY_ALIAS is set: ${{ env.AKANE_RELEASE_KEY_ALIAS != '' }}"

      # 6. Логи и отчёты падения — артефактом, чтобы не потерялись.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Verify debug APK architecture
        if: github.ref == 'refs/heads/debug' && github.event_name != 'pull_request'
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK_FILE"
          ABIS=$(unzip -Z1 "$APK_FILE" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u)
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "Expected only arm64-v8a native libraries, found: ${ABIS:-none}"
            exit 1
          fi
          echo "Verified: $APK_FILE contains only arm64-v8a native libraries."

      - name: Find release apk
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> $GITHUB_ENV

      - name: Find debug apk
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/debug'
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> $GITHUB_ENV

      - name: Upload files to Telegram
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        uses: xz-dev/TelegramFileUploader@v1.1.1
        with:
          to-who: ${{ secrets.TG_CHAT_ID }}
          message: ${{ env.RANDOM_QUOTE }}
          files: |
            ${{ env.APK_FILE }}
        env:
          API_ID: ${{ secrets.TG_APP_ID }}
          API_HASH: ${{ secrets.TG_APP_HASH }}
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}

      - name: Upload apk for pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9

      - name: Upload debug APK artifact
        if: github.ref == 'refs/heads/debug' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          archive: false

      - name: Upload release apk artifact
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          archive: false
