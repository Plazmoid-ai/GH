name: Android CI

on:
  push:
    branches: [ "Develop" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - '.gitignore'
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set release type
        run: echo releaseType=CI > package.properties

      - name: Check signing secrets present
        run: |
          check() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Secret $name is EMPTY or missing"
              exit 1
            else
              echo "Secret $name: present (${#value} chars)"
            fi
          }
          check "SIGNING_KEY" "${{ secrets.SIGNING_KEY }}"
          check "KEY_STORE_PASSWORD" "${{ secrets.KEY_STORE_PASSWORD }}"
          check "ALIAS" "${{ secrets.ALIAS }}"
          check "KEY_PASSWORD" "${{ secrets.KEY_PASSWORD }}"

      - name: Create signing files
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.SIGNING_KEY }}" | base64 -d > $HOME/key.jks
          echo "--- diagnostics ---"
          ls -l $HOME/key.jks
          md5sum $HOME/key.jks
          head -c 8 $HOME/key.jks | xxd   # Проверка magic-байт JKS (должно быть cafebabe)
          echo "-------------------"

      - name: Patch build.gradle to skip broken resourcePlaceholders
        run: |
          cat >> app/build.gradle.kts << 'EOF'

          // WORKAROUND: pt.jcosta.resourceplaceholders is broken with Gradle 9
          tasks.configureEach {
              if (name.startsWith("resourcePlaceholdersFor")) {
                  enabled = false
              }
          }
          EOF
          echo "Patched app/build.gradle.kts. Tail:"
          tail -n 8 app/build.gradle.kts

      - name: Build release APK (arm64-v8a only)
        env:
          AKANE_RELEASE_STORE_FILE: /home/runner/key.jks
          AKANE_RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          AKANE_RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          AKANE_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-configuration-cache --stacktrace -PtargetAbi=arm64-v8a

      - name: Locate and verify APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> $GITHUB_ENV
          echo "Found APK: $APK_FILE"
          ls -l "$APK_FILE"
          echo "--- ABIs inside APK ---"
          unzip -Z1 "$APK_FILE" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/**
          if-no-files-found: warn
          retention-days: 7
