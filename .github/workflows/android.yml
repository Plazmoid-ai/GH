name: Android CI

on:
  push:
    branches: [ "beta", "debug" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - '.gitignore'
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [ "beta" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - '.gitignore'
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:
  
      - name: Generate bot data
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          echo "RANDOM_QUOTE=$(shuf -n1 <<<"$LIST_OF_QUOTES")" >> $GITHUB_ENV
        env:
          LIST_OF_QUOTES: ${{ secrets.LIST_OF_QUOTES }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set release type
        run: echo releaseType=CI > package.properties

      - name: Create signing files
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.KEYSTORE_SECRET }}" | base64 -d > ~/key.jks
          echo "AKANE_RELEASE_STORE_FILE=$(realpath ~/key.jks)" > ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PWD }}" >> ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> ~/.gradle/gradle.properties
          echo "AKANE_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PWD }}" >> ~/.gradle/gradle.properties

      - name: Build with Gradle
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: ./gradlew :app:assembleRelease
  
      - name: Build debug APK (no release keystore required)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/debug'
        run: ./gradlew :app:assembleDebug

      - name: Find release apk
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> $GITHUB_ENV
  
      - name: Find debug apk
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/debug'
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> $GITHUB_ENV

      - name: Upload files to Telegram
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        uses: xz-dev/TelegramFileUploader@v1.1.1
        with:
          to-who: ${{ secrets.TG_CHAT_ID }}
          message: ${{ env.RANDOM_QUOTE }}
          files: |
            ${{ env.APK_FILE }}
        env:
          API_ID: ${{ secrets.TG_APP_ID }}
          API_HASH: ${{ secrets.TG_APP_HASH }}
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}

      - name: Upload apk for pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9

      - name: Upload debug APK artifact
        if: github.ref == 'refs/heads/debug' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          archive: false

      - name: Upload release apk artifact
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/debug'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          archive: false
