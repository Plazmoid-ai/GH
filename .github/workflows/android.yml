name: Android CI

on:
  push:
    branches: [ "beta", "new_swipe_smart", "experimen/main-screen-list" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - '.gitignore'
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [ "beta" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - '.gitignore'
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Reinstall the pinned NDK if the runner's copy is incomplete.
      - name: Repair Android NDK installation
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -f "$NDK_DIR/source.properties" ]; then
            rm -rf "$NDK_DIR"
            yes | "$SDKMANAGER" --licenses
            "$SDKMANAGER" "ndk;$NDK_VERSION"
          fi

          test -f "$NDK_DIR/source.properties"

      - name: Set release type
        run: echo releaseType=CI > package.properties

      # --- Ключи передаются в окружение ---
      - name: Create signing files
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_SECRET }}" | base64 -d > ~/key.jks
          {
            echo "AKANE_RELEASE_STORE_FILE=$(realpath ~/key.jks)"
            echo "AKANE_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PWD }}"
            echo "AKANE_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "AKANE_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PWD }}"
          } >> "$GITHUB_ENV"

      # --- Сборка (только arm64-v8a) ---
      - name: Build with Gradle
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease -PtargetAbi=arm64-v8a --console=plain

      - name: Build with Gradle for pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug -PtargetAbi=arm64-v8a --console=plain

      # --- Поиск APK ---
      - name: Find apk
        if: github.event_name != 'pull_request'
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename $APK_FILE .apk)" >> $GITHUB_ENV

      - name: Find apk for pull request
        if: github.event_name == 'pull_request'
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename $APK_FILE .apk)" >> $GITHUB_ENV

      # --- Загрузка артефакта ---
      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9
